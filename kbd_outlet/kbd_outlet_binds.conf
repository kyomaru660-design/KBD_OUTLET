# =============================================================================
# kbd-outlet - Hyprland keybinds for your second keyboard
#
# NO MATH REQUIRED. Each code below is ALREADY the Hyprland keycode
# (the physical key's evdev code + 8, the xkb offset). Just edit the exec.
#
# Every code maps to a verified-UNASSIGNED kernel keycode: no real keyboard,
# laptop, or multimedia device emits these, so nothing can conflict.
#
# Load it from hyprland.conf with:
#   source = ~/.config/hypr/kbd_outlet_binds.conf
#
# Verify a key with:  wev   (press it, read the 'code' it reports)
# =============================================================================

#--- Number row ( ` 1 2 3 4 5 6 7 8 9 0 - = Bksp ) ---

bind = , code:183, exec, code ~/.local/share/kbd-outlet/kbd_outlet_binds.conf
bind = , code:184, exec, notify-send "1"
bind = , code:185, exec, notify-send "2"
bind = , code:186, exec, notify-send "3"
bind = , code:187, exec, notify-send "4"
bind = , code:188, exec, notify-send "5"
bind = , code:189, exec, notify-send "6"
bind = , code:190, exec, notify-send "7"
bind = , code:191, exec, notify-send "8"
bind = , code:192, exec, notify-send "9"
bind = , code:193, exec, notify-send "0"
bind = , code:194, exec, notify-send "minus"
bind = , code:641, exec, notify-send "equal"
bind = , code:642, exec, notify-send "backspace"

#--- Top alpha row ( Tab Q W E R T Y U I O P [ ] \ ) ---

bind = , code:643, exec, notify-send "tab"
bind = , code:644, exec, notify-send "Q"
bind = , code:391, exec, notify-send "W"
bind = , code:656, exec, notify-send "E"
bind = , code:657, exec, notify-send "R"
bind = , code:658, exec, notify-send "T"
bind = , code:659, exec, notify-send "Y"
bind = , code:660, exec, notify-send "U"
bind = , code:661, exec, notify-send "I"
bind = , code:662, exec, notify-send "O"
bind = , code:663, exec, notify-send "P"
bind = , code:664, exec, notify-send "leftbrace"
bind = , code:665, exec, notify-send "rightbrace"
bind = , code:666, exec, notify-send "backslash"

#--- Home row ( Caps A S D F G H J K L ; ' Enter ) ---

bind = , code:667, exec, notify-send "capslock"
bind = , code:668, exec, notify-send "A"
bind = , code:669, exec, notify-send "S"
bind = , code:670, exec, notify-send "D"
bind = , code:671, exec, notify-send "F"
bind = , code:672, exec, notify-send "G"
bind = , code:673, exec, notify-send "H"
bind = , code:674, exec, notify-send "J"
bind = , code:675, exec, notify-send "K"
bind = , code:676, exec, notify-send "L"
bind = , code:677, exec, notify-send "semicolon"
bind = , code:678, exec, notify-send "apostrophe"
bind = , code:679, exec, notify-send "enter"

#--- Bottom alpha row ( LShift Z X C V B N M , . / RShift ) ---

bind = , code:680, exec, notify-send "leftshift"
bind = , code:681, exec, notify-send "Z"
bind = , code:682, exec, notify-send "X"
bind = , code:683, exec, notify-send "C"
bind = , code:684, exec, notify-send "V"
bind = , code:685, exec, notify-send "B"
bind = , code:377, exec, notify-send "N"
bind = , code:378, exec, notify-send "M"
bind = , code:379, exec, notify-send "comma"
bind = , code:380, exec, notify-send "dot"
bind = , code:381, exec, notify-send "slash"
bind = , code:382, exec, notify-send "rightshift"

#--- Modifier row + Esc ( LCtrl LMeta LAlt Space RAlt Fn RCtrl Esc ) ---

bind = , code:383, exec, notify-send "leftctrl"
bind = , code:384, exec, notify-send "leftmeta"
bind = , code:385, exec, notify-send "leftalt"
bind = , code:386, exec, notify-send "space"
bind = , code:387, exec, notify-send "rightalt"
bind = , code:388, exec, notify-send "fn"
bind = , code:389, exec, notify-send "rightctrl"
bind = , code:390, exec, notify-send "escape"
